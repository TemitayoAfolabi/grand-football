name: Sync live fixtures

on:
  schedule:
    # GitHub Actions schedules are UTC. Run throughout the day so a late
    # fixture is also finalised after midnight; the endpoint applies its own
    # 10-minute API throttle.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-live-fixtures
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Sync fixtures from API-Football
        env:
          SYNC_CRON_SECRET: ${{ secrets.SYNC_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${SYNC_CRON_SECRET}" \
            https://grand-football.vercel.app/api/cron/sync-fixtures
