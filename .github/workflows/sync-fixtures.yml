name: Sync live fixtures

on:
  # Supabase pg_cron is the production scheduler. GitHub Actions schedules on
  # public repositories are best-effort and caused delayed live-score updates.
  # Keep this workflow as an authenticated manual recovery tool only.
  workflow_dispatch:

concurrency:
  group: sync-live-fixtures
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Sync fixtures from API-Football
        env:
          SYNC_CRON_SECRET: ${{ secrets.SYNC_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${SYNC_CRON_SECRET}" \
            https://grand-football.vercel.app/api/cron/sync-fixtures
